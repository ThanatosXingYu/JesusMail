<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>您的 JesusMail 登录信息</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #e4e7eb;border-radius:8px;overflow:hidden;">
                    <tr>
                        <td style="padding:28px 32px;background:#123b5d;color:#ffffff;">
                            <div style="font-size:20px;font-weight:600;">JesusMail</div>
                            <div style="margin-top:8px;font-size:14px;color:#d8e6f1;">您的邮箱已成功开通</div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:30px 32px;">
                            <p style="margin:0 0 18px;font-size:15px;line-height:1.75;">您好，您申请的 JesusMail 邮箱已经创建完成。以下是登录信息，请妥善保存。</p>
                            <div style="margin:0 0 22px;padding:18px;background:#f8fafb;border-left:3px solid #0f766e;font-size:14px;line-height:1.9;">
                                <div>邮箱账号：<strong style="word-break:break-all;">{{ .Email }}</strong></div>
                                <div>登录密码：<strong style="word-break:break-all;">{{ .Password }}</strong></div>
                                <div>登录地址：<a href="{{ .WebmailURL }}" style="color:#0f766e;word-break:break-all;">{{ .WebmailURL }}</a></div>
                            </div>
                            <p style="margin:0 0 22px;">
                                <a href="{{ .WebmailURL }}" style="display:inline-block;padding:11px 20px;background:#0f766e;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">进入我的邮箱</a>
                            </p>
                            <p style="margin:0;font-size:13px;line-height:1.75;color:#52606d;">这封邮件包含登录密码，请不要转发给他人。首次登录后建议及时修改密码。</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
