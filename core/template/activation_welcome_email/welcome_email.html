<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>您的邮箱已开通</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border:1px solid #e4e7eb;border-radius:8px;overflow:hidden;">
                    <tr>
                        <td style="padding:28px 32px;background:#123b5d;color:#ffffff;">
                            <div style="font-size:20px;font-weight:600;">JesusMail</div>
                            <div style="margin-top:8px;font-size:14px;color:#d8e6f1;">邮箱激活成功</div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <p style="margin:0 0 16px;font-size:16px;line-height:1.7;">您好，您的邮箱 <strong>{{ .Email }}</strong> 已成功开通。</p>
                            <p style="margin:0 0 16px;font-size:14px;line-height:1.7;">您可以点击下面的地址登录网页邮箱：</p>
                            <p style="margin:0 0 24px;">
                                <a href="{{ .WebmailURL }}" style="display:inline-block;padding:10px 18px;background:#0f766e;color:#ffffff;text-decoration:none;border-radius:6px;">打开网页邮箱</a>
                            </p>
                            <p style="margin:0 0 16px;font-size:14px;line-height:1.7;word-break:break-all;">登录地址：<a href="{{ .WebmailURL }}" style="color:#0f766e;">{{ .WebmailURL }}</a></p>
                            <div style="margin:24px 0;padding:16px;background:#f8fafb;border-left:3px solid #0f766e;font-size:14px;line-height:1.8;">
                                <div style="font-weight:600;margin-bottom:6px;">服务器配置提示</div>
                                <div>SMTP / IMAP / POP3 服务器：{{ .Domain }}</div>
                                <div>用户名：请填写完整邮箱地址 {{ .Email }}</div>
                                <div>端口和加密方式：请以管理员提供的配置为准</div>
                            </div>
                            <p style="margin:0;font-size:14px;line-height:1.7;color:#52606d;">如果您能收到这封邮件，说明该邮箱的收发功能正常。建议您登录后及时检查邮箱设置。</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
