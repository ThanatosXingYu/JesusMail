<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>激活码管理 · JesusMail</title>
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<style>
    :root {
        --primary: #2080f0; --primary-hover: #4098fc;
        --text: #333639; --text2: #666e75; --text3: #909399;
        --border: #e5e7eb; --bg: #f7f8fa; --card: #ffffff;
        --green: #18a058; --red: #d03050; --orange: #f0a020;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: v-sans, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh;
    }
    body.embed { background: transparent; }
    header {
        height: 56px; background: var(--card); border-bottom: 1px solid var(--border);
        display: flex; align-items: center; padding: 0 24px; gap: 12px;
        position: sticky; top: 0; z-index: 10;
    }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 16px; font-weight: 600; flex: 1; }
    header a.back {
        color: var(--text2); text-decoration: none; font-size: 13px;
        border: 1px solid var(--border); border-radius: 3px; padding: 5px 12px; background: #fff;
    }
    header a.back:hover { color: var(--primary); border-color: var(--primary); }
    body.embed header { display: none; }
    .wrap { max-width: 1200px; margin: 20px auto; padding: 0 24px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
    .stat {
        background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 16px 20px;
    }
    .stat .num { font-size: 26px; font-weight: 600; }
    .stat .lbl { font-size: 13px; color: var(--text3); margin-top: 2px; }
    .stat.t1 .num { color: var(--primary); } .stat.t2 .num { color: var(--green); } .stat.t3 .num { color: var(--orange); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 16px 20px; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar .spacer { flex: 1; }
    select, input[type=number], input[type=text] {
        height: 32px; border: 1px solid var(--border); border-radius: 3px; padding: 0 10px;
        font-size: 13px; color: var(--text); outline: none; background: #fff;
    }
    select:focus, input:focus { border-color: var(--primary); }
    .btn {
        height: 32px; padding: 0 16px; border-radius: 3px; border: 1px solid var(--border);
        background: #fff; color: var(--text); font-size: 13px; cursor: pointer;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-hover); color: #fff; }
    .btn.danger { color: var(--red); }
    .btn.danger:hover { border-color: var(--red); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f0f0f5; font-size: 13px; white-space: nowrap; }
    th { color: var(--text3); font-weight: 500; background: #fafafc; }
    td.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; letter-spacing: .5px; cursor: pointer; }
    td.code:hover { color: var(--primary); }
    td.muted { color: var(--text3); }
    tr:hover td { background: #fafcff; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 12px; }
    .tag.unused { background: rgba(32,128,240,.1); color: var(--primary); }
    .tag.used { background: rgba(24,160,88,.1); color: var(--green); }
    .tag.disabled { background: rgba(240,160,32,.12); color: var(--orange); }
    .tag.group { background: #f2f3f8; color: var(--text2); }
    .batchbar {
        display: flex; align-items: center; gap: 12px; padding-top: 14px; margin-top: 4px;
        border-top: 1px solid #f0f0f5; color: var(--text2); font-size: 13px; flex-wrap: wrap;
    }
    .batchbar .sel { color: var(--primary); }
    .batchbar .spacer { flex: 1; }
    .pager { display: flex; align-items: center; gap: 12px; color: var(--text2); font-size: 13px; }
    .msg { margin: 10px 0; padding: 9px 14px; border-radius: 3px; font-size: 13px; display: none; }
    .msg.ok { background: rgba(24,160,88,.08); color: var(--green); border: 1px solid rgba(24,160,88,.25); }
    .msg.err { background: rgba(208,48,80,.06); color: var(--red); border: 1px solid rgba(208,48,80,.2); }
    .empty { text-align: center; color: var(--text3); padding: 40px 0; }
    #gate {
        position: fixed; inset: 0; background: var(--bg); z-index: 99;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    #gate img { width: 72px; height: 72px; }
    #gate p { color: var(--text2); }
    #gate a { color: #fff; text-decoration: none; background: var(--primary); padding: 9px 22px; border-radius: 3px; }
    .gen-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .gen-box label { color: var(--text2); font-size: 13px; }
    @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div id="gate" style="display:none">
    <img src="/custom/logo.svg" alt="QLU Mail">
    <p id="gateMsg">请先登录 JesusMail 管理后台</p>
    <a id="gateBtn" href="/">前往登录后台</a>
</div>

<header>
    <img src="/custom/logo.svg" alt="">
    <h1>激活码管理</h1>
    <a class="back" href="/" id="btnBack">返回控制台</a>
</header>

<div class="wrap">
    <div class="stats">
        <div class="stat"><div class="num" id="stTotal">-</div><div class="lbl">激活码总数</div></div>
        <div class="stat t1"><div class="num" id="stUnused">-</div><div class="lbl">未使用</div></div>
        <div class="stat t2"><div class="num" id="stUsed">-</div><div class="lbl">已使用</div></div>
        <div class="stat t3"><div class="num" id="stDisabled">-</div><div class="lbl">已禁用</div></div>
    </div>

    <div class="card">
        <div class="toolbar">
            <div class="gen-box">
                <label>批量生成</label>
                <input type="number" id="genCount" min="1" max="500" value="20" style="width:90px">
                <label>分组</label>
                <input type="text" id="genGroup" placeholder="如：2026新生" list="groupList" style="width:130px">
                <label>备注</label>
                <input type="text" id="genNote" placeholder="选填" style="width:140px">
                <button class="btn primary" id="btnGen">生成激活码</button>
            </div>
            <div class="spacer"></div>
            <select id="groupFilter" style="max-width:150px"><option value="">全部分组</option><option value="__none__">未分组</option></select>
            <select id="filter">
                <option value="">全部状态</option>
                <option value="0">未使用</option>
                <option value="1">已使用</option>
                <option value="2">已禁用</option>
            </select>
            <button class="btn" id="btnRefresh">刷新</button>
            <button class="btn" id="btnExport">导出 CSV</button>
        </div>
        <div class="msg" id="msg"></div>
        <table>
            <thead>
                <tr>
                    <th style="width:34px"><input type="checkbox" id="chkAll"></th>
                    <th>ID</th><th>激活码</th><th>状态</th><th>分组</th><th>关联邮箱</th><th>使用时间</th><th>备注</th><th>创建时间</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="tbody"><tr><td colspan="10" class="empty">加载中…</td></tr></tbody>
        </table>
        <div class="batchbar">
            <span>已选 <span class="sel" id="selCount">0</span> 项</span>
            <button class="btn" id="btnGroup">批量分组</button>
            <button class="btn danger" id="btnDel">批量删除（仅未使用）</button>
            <button class="btn danger" id="btnDelUsed">批量删除（含已使用）</button>
            <div class="spacer"></div>
            <div class="pager">
                <span id="pageInfo"></span>
                <button class="btn" id="pgPrev">上一页</button>
                <button class="btn" id="pgNext">下一页</button>
            </div>
        </div>
    </div>
</div>
<datalist id="groupList"></datalist>

<script>
const API = 'https://mail.qlu.edu.kg/keys_api.php';
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
let TOKEN = null, page = 1, pageSize = 50, totalPages = 1, GROUPS = [], lastGroup = '';

if (EMBED) document.body.classList.add('embed');
else document.getElementById('btnBack').style.display = '';

function getToken() {
    try {
        const s = JSON.parse(localStorage.getItem('UserStore') || 'null');
        if (s && s.login && s.login.token) return s.login.token;
    } catch (e) {}
    for (let i = 0; i < localStorage.length; i++) {
        const v = localStorage.getItem(localStorage.key(i));
        const m = /"token":"(eyJ[\w-]+\.[\w-]+\.[\w-]+)"/.exec(v || '');
        if (m) return m[1];
    }
    return null;
}

function showGate(msg) {
    document.getElementById('gateMsg').textContent = msg || '请先登录 JesusMail 管理后台';
    document.getElementById('gate').style.display = 'flex';
}

async function api(action, opts = {}) {
    const resp = await fetch(`${API}?action=${action}`, Object.assign({
        headers: { 'X-Auth-Token': TOKEN, 'Content-Type': 'application/json' },
    }, opts));
    if (resp.status === 401) { showGate('登录态已失效，请重新登录后台'); throw new Error('401'); }
    return resp.json();
}

function flash(type, text) {
    const el = document.getElementById('msg');
    el.className = 'msg ' + type; el.textContent = text; el.style.display = 'block';
    clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 5000);
}

const STATUS = { 0: ['unused', '未使用'], 1: ['used', '已使用'], 2: ['disabled', '已禁用'] };
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(d) { return d ? String(d).replace('T', ' ') : '-'; }

function refreshGroupUI() {
    const gf = document.getElementById('groupFilter');
    const cur = gf.value;
    gf.innerHTML = '<option value="">全部分组</option><option value="__none__">未分组</option>' +
        GROUPS.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
    if ([...gf.options].some(o => o.value === cur)) gf.value = cur;
    document.getElementById('groupList').innerHTML = GROUPS.map(g => `<option value="${esc(g)}">`).join('');
}

async function loadStats() {
    const r = await api('stats');
    if (r.success) {
        stTotal.textContent = r.data.total; stUnused.textContent = r.data.unused;
        stUsed.textContent = r.data.used; stDisabled.textContent = r.data.disabled;
    }
}

function updateSelCount() {
    document.getElementById('selCount').textContent = document.querySelectorAll('.rowChk:checked').length;
}

async function loadList() {
    const status = document.getElementById('filter').value;
    const group  = document.getElementById('groupFilter').value;
    let q = `list&page=${page}&page_size=${pageSize}`;
    if (status !== '') q += `&status=${status}`;
    if (group !== '') q += `&group=${encodeURIComponent(group)}`;
    const r = await api(q);
    const tb = document.getElementById('tbody');
    if (!r.success) { tb.innerHTML = '<tr><td colspan="10" class="empty">加载失败</td></tr>'; return; }
    GROUPS = r.data.groups || [];
    refreshGroupUI();
    totalPages = Math.max(1, Math.ceil(r.data.total / pageSize));
    document.getElementById('pageInfo').textContent = `共 ${r.data.total} 条 / 第 ${page} 页`;
    document.getElementById('pgPrev').disabled = page <= 1;
    document.getElementById('pgNext').disabled = page >= totalPages;
    if (!r.data.list.length) { tb.innerHTML = '<tr><td colspan="10" class="empty">暂无激活码</td></tr>'; updateSelCount(); return; }
    tb.innerHTML = r.data.list.map(k => {
        const [cls, txt] = STATUS[k.status] || ['', '?'];
        const grp = k.group_name ? `<span class="tag group">${esc(k.group_name)}</span>` : '<span class="muted">未分组</span>';
        return `<tr>
            <td><input type="checkbox" class="rowChk" value="${k.id}"></td>
            <td class="muted">${k.id}</td>
            <td class="code" title="点击复制" onclick="copyCode(this)">${esc(k.keycode)}</td>
            <td><span class="tag ${cls}">${txt}</span></td>
            <td>${grp}</td>
            <td>${k.email ? esc(k.email) : '<span class="muted">-</span>'}</td>
            <td class="muted">${fmt(k.used_at)}</td>
            <td class="muted">${esc(k.note || '-')}</td>
            <td class="muted">${fmt(k.created_at)}</td>
            <td>${k.status === 0
                ? `<button class="btn danger" style="height:26px;padding:0 10px" onclick="delOne(${k.id}, false)">删除</button>`
                : `<button class="btn danger" style="height:26px;padding:0 10px" onclick="delOne(${k.id}, true)">删除记录</button>`}</td>
        </tr>`;
    }).join('');
    tb.querySelectorAll('.rowChk').forEach(c => c.addEventListener('change', updateSelCount));
    document.getElementById('chkAll').checked = false;
    updateSelCount();
}

function copyCode(el) {
    const code = el.textContent.trim();
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject())
        .then(() => flash('ok', `已复制：${code}`))
        .catch(() => { const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); flash('ok', `已复制：${code}`); });
}

async function reload() { await Promise.all([loadStats(), loadList()]); }

function checkedIds() { return [...document.querySelectorAll('.rowChk:checked')].map(c => parseInt(c.value, 10)); }

async function delIds(ids, force = false) {
    if (!ids.length) { flash('err', '请先勾选要删除的激活码'); return; }
    const tip = force
        ? `确认删除选中的 ${ids.length} 个激活码？含已使用的也会一并删除，激活记录将不可恢复！`
        : `确认删除选中的 ${ids.length} 个激活码？（已使用的不会被删除）`;
    if (!confirm(tip)) return;
    const r = await api('delete', { method: 'POST', body: JSON.stringify({ ids, force }) });
    if (r.success) {
        flash('ok', `已删除 ${r.data.deleted} 个` + (r.data.skipped_used ? `，${r.data.skipped_used} 个已使用被保留` : ''));
        reload();
    } else flash('err', r.msg || '删除失败');
}

function delOne(id, force) { delIds([id], force); }

async function setGroup() {
    const ids = checkedIds();
    if (!ids.length) { flash('err', '请先勾选激活码（已使用的也可分组）'); return; }
    const g = prompt(
        `将 ${ids.length} 个激活码设置分组：\n输入分组名称（新建或已有），留空则移出分组（设为未分组）：`,
        lastGroup
    );
    if (g === null) return;
    const group = g.trim();
    lastGroup = group;
    const r = await api('set_group', { method: 'POST', body: JSON.stringify({ ids, group }) });
    if (r.success) {
        flash('ok', group ? `已将 ${r.data.updated} 个激活码归入分组「${group}」` : `已将 ${r.data.updated} 个激活码移出分组`);
        reload();
    } else flash('err', r.msg || '设置失败');
}

document.getElementById('btnGen').onclick = async () => {
    const count = parseInt(document.getElementById('genCount').value, 10);
    const note = document.getElementById('genNote').value.trim();
    const group = document.getElementById('genGroup').value.trim();
    if (!(count >= 1 && count <= 500)) { flash('err', '生成数量需在 1-500 之间'); return; }
    const r = await api('add', { method: 'POST', body: JSON.stringify({ count, note, group }) });
    if (r.success) { flash('ok', `成功生成 ${r.data.created} 个激活码` + (group ? `（分组：${group}）` : '')); reload(); }
    else flash('err', r.msg || '生成失败');
};
document.getElementById('btnDel').onclick = () => delIds(checkedIds(), false);
document.getElementById('btnDelUsed').onclick = () => delIds(checkedIds(), true);
document.getElementById('btnGroup').onclick = setGroup;
document.getElementById('btnRefresh').onclick = reload;
document.getElementById('btnExport').onclick = async () => {
    const status = document.getElementById('filter').value;
    const group  = document.getElementById('groupFilter').value;
    let q = 'export';
    if (status !== '') q += `&status=${status}`;
    if (group !== '') q += `&group=${encodeURIComponent(group)}`;
    try {
        const resp = await fetch(`${API}?action=${q}`, { headers: { 'X-Auth-Token': TOKEN } });
        if (resp.status === 401) { showGate('登录态已失效，请重新登录后台'); return; }
        if (!resp.ok) { flash('err', '导出失败'); return; }
        const blob = await resp.blob();
        const gf = document.getElementById('groupFilter');
        const gname = group ? gf.options[gf.selectedIndex].text : '全部';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `激活码_${gname}_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
        flash('ok', '导出成功');
    } catch (e) { flash('err', '导出失败'); }
};
document.getElementById('filter').onchange = () => { page = 1; loadList(); };
document.getElementById('groupFilter').onchange = () => { page = 1; loadList(); };
document.getElementById('pgPrev').onclick = () => { if (page > 1) { page--; loadList(); } };
document.getElementById('pgNext').onclick = () => { if (page < totalPages) { page++; loadList(); } };
document.getElementById('chkAll').onchange = e => {
    document.querySelectorAll('.rowChk').forEach(c => c.checked = e.target.checked);
    updateSelCount();
};

(async function init() {
    TOKEN = getToken();
    if (!TOKEN) { showGate(); return; }
    try { await reload(); }
    catch (e) { /* 401 已由 api() 处理 */ }
})();
</script>
</body>
</html>
