<roundcube:include file="includes/layout.html" />

<h1 class="voice"><roundcube:object name="productname" /> <roundcube:label name="login" /></h1>

<div id="layout-content" class="selected no-navbar" role="main">
	<roundcube:object name="logo" src="/images/logo.svg" id="logo" alt="JesusMail" />
	<roundcube:form id="login-form" name="login-form" method="post" class="propform">
	<roundcube:object name="loginform" form="login-form" size="40" submit=true class="form-control" />
		<style>
			#jesusmail-activate-entry { margin-top: 4px; }
			#jesusmail-activate-entry a {
				display: block; text-align: center; padding: 10px 12px;
				background: linear-gradient(135deg,#1e6fd9,#0aa2c0);
				color: #fff; font-weight: 600; font-size: .95rem; letter-spacing: .5px;
				border-radius: .4rem; text-decoration: none;
				box-shadow: 0 4px 14px rgba(14,120,200,.35);
			}
			#jesusmail-activate-entry a:hover { filter: brightness(1.08); color: #fff; }
		</style>
		<div id="jesusmail-activate-entry">
			<a href="https://mail.qlu.edu.kg/activate">首次使用？使用邀请码创建邮箱 &raquo;</a>
		</div>
		<div id="login-footer" role="contentinfo"></div>
	</form>
</div>

<div id="jesusmail-activation-notice" class="jesusmail-notice-backdrop" hidden>
	<div class="jesusmail-notice-dialog" role="dialog" aria-modal="true" aria-labelledby="jesusmail-notice-title" aria-describedby="jesusmail-notice-description">
		<button type="button" class="jesusmail-notice-close" aria-label="关闭提示">&times;</button>
		<div class="jesusmail-notice-badge">首次使用</div>
		<h2 id="jesusmail-notice-title">请先使用邀请码创建邮箱</h2>
		<p id="jesusmail-notice-description">JesusMail 邮箱需要使用邀请码激活创建。已经拥有邮箱的用户可以直接关闭提示并登录。</p>
		<a class="jesusmail-notice-primary" href="https://mail.qlu.edu.kg/activate">使用邀请码激活邮箱</a>
		<button type="button" class="jesusmail-notice-secondary">已有邮箱，直接登录</button>
	</div>
</div>

<style>
	#jesusmail-activation-notice[hidden] { display: none !important; }
	.jesusmail-notice-backdrop {
		position: fixed; inset: 0; z-index: 10000;
		display: flex; align-items: center; justify-content: center;
		padding: 20px; background: rgba(10, 24, 38, .62);
		opacity: 0; transition: opacity .18s ease;
	}
	.jesusmail-notice-backdrop.is-visible { opacity: 1; }
	.jesusmail-notice-dialog {
		position: relative; width: min(420px, 100%);
		box-sizing: border-box; padding: 28px;
		background: #fff; color: #1f2933;
		border: 1px solid #d9e0e6; border-radius: 8px;
		box-shadow: 0 24px 70px rgba(4, 20, 34, .28);
		transform: translateY(10px); transition: transform .18s ease;
	}
	.jesusmail-notice-backdrop.is-visible .jesusmail-notice-dialog { transform: translateY(0); }
	.jesusmail-notice-close {
		position: absolute; top: 12px; right: 12px;
		width: 32px; height: 32px; padding: 0;
		border: 0; border-radius: 6px; background: transparent;
		color: #64748b; font-size: 26px; line-height: 30px; cursor: pointer;
	}
	.jesusmail-notice-close:hover { background: #eef2f5; color: #1f2933; }
	.jesusmail-notice-badge {
		display: inline-block; padding: 4px 9px; margin-bottom: 14px;
		border-radius: 4px; background: #e5f5f2; color: #0f766e;
		font-size: 12px; font-weight: 700; letter-spacing: .5px;
	}
	.jesusmail-notice-dialog h2 {
		margin: 0 0 12px; color: #16324a;
		font-size: 21px; line-height: 1.35;
	}
	.jesusmail-notice-dialog p {
		margin: 0 0 22px; color: #52606d;
		font-size: 14px; line-height: 1.75;
	}
	.jesusmail-notice-primary {
		display: block; box-sizing: border-box; width: 100%; padding: 11px 16px;
		border-radius: 6px; background: #0f766e; color: #fff !important;
		text-align: center; text-decoration: none; font-size: 15px; font-weight: 700;
	}
	.jesusmail-notice-primary:hover { background: #0b655e; }
	.jesusmail-notice-secondary {
		display: block; width: 100%; padding: 10px 16px; margin-top: 8px;
		border: 0; border-radius: 6px; background: transparent;
		color: #52606d; font-size: 13px; cursor: pointer;
	}
	.jesusmail-notice-secondary:hover { background: #f1f5f7; color: #1f2933; }
	@media (max-width: 480px) {
		.jesusmail-notice-backdrop { align-items: flex-end; padding: 12px; }
		.jesusmail-notice-dialog { padding: 24px 20px 18px; }
	}
	@media (prefers-reduced-motion: reduce) {
		.jesusmail-notice-backdrop, .jesusmail-notice-dialog { transition: none; }
	}
</style>

<script>
	(function () {
		var notice = document.getElementById('jesusmail-activation-notice');
		if (!notice || sessionStorage.getItem('jesusmail_activation_notice_seen') === '1') {
			return;
		}

		var closeButton = notice.querySelector('.jesusmail-notice-close');
		var secondaryButton = notice.querySelector('.jesusmail-notice-secondary');
		var dialog = notice.querySelector('.jesusmail-notice-dialog');

		function dismissNotice() {
			sessionStorage.setItem('jesusmail_activation_notice_seen', '1');
			notice.classList.remove('is-visible');
			window.setTimeout(function () {
				notice.hidden = true;
			}, 180);
		}

		notice.hidden = false;
		window.requestAnimationFrame(function () {
			notice.classList.add('is-visible');
			closeButton.focus();
		});
		window.addEventListener('load', function () {
			closeButton.focus();
		});

		closeButton.addEventListener('click', dismissNotice);
		secondaryButton.addEventListener('click', dismissNotice);
		notice.addEventListener('click', function (event) {
			if (event.target === notice) {
				dismissNotice();
			}
		});
		document.addEventListener('keydown', function (event) {
			if (event.key === 'Escape' && !notice.hidden) {
				dismissNotice();
			} else if (event.key === 'Tab' && !notice.hidden) {
				var focusable = dialog.querySelectorAll('button, a[href]');
				var first = focusable[0];
				var last = focusable[focusable.length - 1];
				if (!dialog.contains(document.activeElement)) {
					event.preventDefault();
					first.focus();
				} else if (event.shiftKey && document.activeElement === first) {
					event.preventDefault();
					last.focus();
				} else if (!event.shiftKey && document.activeElement === last) {
					event.preventDefault();
					first.focus();
				}
			}
		});
	}());
</script>

<noscript>
	<p class="noscriptwarning"><roundcube:label name="noscriptwarning" /></p>
</noscript>
