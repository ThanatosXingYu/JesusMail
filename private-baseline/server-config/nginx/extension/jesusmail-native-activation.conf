# JesusMail native activation routes. Legacy PHP files remain on disk for rollback.
location = /activate.php {
    return 301 /activate;
}

location = /keys_api.php {
    return 404;
}

location = /activate {
    proxy_pass https://127.0.0.1:41443;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

location = /activate/ {
    proxy_pass https://127.0.0.1:41443;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

# Public activation API is used by the production frontend without /api prefix.
# Only expose the two required methods/paths; do not expose /public/ wholesale.
location = /public/activation/activate {
    limit_except POST { deny all; }
    proxy_pass https://127.0.0.1:41443;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

location = /public/activation/config {
    limit_except GET { deny all; }
    proxy_pass https://127.0.0.1:41443;
