server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name mail.qlu.edu.kg;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/mail.qlu.edu.kg;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/mail.qlu.edu.kg.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/mail.qlu.edu.kg/*.conf;

    #QLU-MAIL-START 自定义路由：HTTP统一跳HTTPS；根路径跳登录页；/roundcube 反代 BillionMail；激活数据目录禁止访问
    if ($scheme = http) { return 301 https://$host$request_uri; }

    location = / {
        return 301 /roundcube/;
    }

    location = /roundcube {
        return 301 /roundcube/;
    }

    # 原生激活页及其公开 API 在上方 extension/jesusmail-native-activation.conf 中定义。
    # 请勿在主站配置重复声明这些 location（否则 nginx -t 报 duplicate location）。
    # 前端使用不带 /api 前缀的公开接口；扩展文件同时反代两个前缀。
    # 激活页公开配置（激活域名/配额），避免前端硬编码域名
    location ^~ /roundcube/ {
        proxy_pass https://127.0.0.1:41443;
        proxy_ssl_verify off;
        proxy_ssl_verify_depth 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    #QLU-MAIL-END

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/mail.qlu.edu.kg/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/mail.qlu.edu.kg/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #QLU-MAIL-START 激活页数据目录禁止任何 HTTP 访问（放在 PHP 引用之前确保优先匹配）
    location ~ ^/activate_data/ {
        return 404;
    }
    #QLU-MAIL-END

    #QLU-MAIL-START 文档类文件一律禁止下载（README/HANDOFF 等，防止换名绕过宝塔默认规则）
    location ~* \.(md|markdown|csv|sqlite|db)$ {
        return 404;
    }
    #QLU-MAIL-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-82.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/mail.qlu.edu.kg.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }
    
    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        access_log  /dev/null;
		error_log  /dev/null;
				#Monitor-Config-Start 网站监控报表日志发送配置
				access_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=4__access monitor;
				error_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=4__error;
				#Monitor-Config-End
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        access_log  /dev/null;
		error_log  /dev/null;
				#Monitor-Config-Start 网站监控报表日志发送配置
				access_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=4__access monitor;
				error_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=4__error;
				#Monitor-Config-End
    }
    access_log  /www/wwwlogs/mail.qlu.edu.kg.log;
    error_log  /www/wwwlogs/mail.qlu.edu.kg.error.log;

    #Monitor-Config-Start 网站监控报表日志发送配置
    access_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=4__access monitor;
    error_log syslog:server=unix:/tmp/bt-monitor.sock,nohostname,tag=4__error;
    #Monitor-Config-End
}